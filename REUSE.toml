version = 1

# Firmware Binaries
[[annotations]]
path = [
    "usbmuxctl/firmware/*.bin"
]
precedence = "override"
SPDX-FileCopyrightText = "2021 The USB-MUX-CTL Authors"
SPDX-License-Identifier = "LGPL-2.1-or-later"

# Debian Packaging
[[annotations]]
path = [
    "debian/changelog",
    "debian/compat",
    "debian/control",
    "debian/rules",
]
precedence = "override"
SPDX-FileCopyrightText = "2024 The USB-MUX-CTL Authors"
SPDX-License-Identifier = "LGPL-2.1-or-later"

# Config files etc.
[[annotations]]
path = [
    ".codespellrc",
    ".gitignore",
    "MANIFEST.in",
    "pyproject.toml",
    "REUSE.toml",
    ".github/workflows/check-and-publish.yaml",
]
precedence = "override"
SPDX-FileCopyrightText = "2017 The USB-MUX-CTL Authors"
SPDX-License-Identifier = "CC0-1.0"

# The AUTHORS file itself
[[annotations]]
path = [
    "AUTHORS",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 The USB-MUX-CTL Authors"
SPDX-License-Identifier = "CC0-1.0"
